name: Bug report
description: Report a problem with PeriHub.
body:
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "0.6.2"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11"
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - AULA SC900 Pro
        - Corsair K95 RGB Platinum
        - No supported device connected
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options:
        - Original 8K receiver
        - USB wired
        - Both cable and receiver connected
        - Not connected
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include steps to reproduce, expected behavior and actual behavior. Avoid sharing personal account details.
    validations:
      required: true
